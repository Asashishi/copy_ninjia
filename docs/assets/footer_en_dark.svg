<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 48" width="1080" height="48" role="img" aria-label="Copy Ninjia — Not just copying messages, but stealing the entire group-chat scene and re-enacting it.">
  <title>Copy Ninjia — Not just copying messages, but stealing the entire group-chat scene and re-enacting it.</title>
  <defs>
    <linearGradient id="g-dark" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a99bff"/><stop offset="1" stop-color="#58b9ec"/></linearGradient>
    <style>
      .txt { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 500; font-size: 20px; }
      .code { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-weight: 700; font-size: 21px; }
    </style>
  </defs>
  <text x="10" y="32" class="txt">
    <tspan class="code" fill="url(#g-dark)">Copy Ninjia</tspan>
    <tspan fill="#e6edf3"> — Not just copying messages, but </tspan>
    <tspan fill="#a99bff">stealing the entire group-chat scene</tspan>
    <tspan fill="#e6edf3"> and re-enacting it.</tspan>
  </text>
</svg>
