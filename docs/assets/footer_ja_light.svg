<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 48" width="960" height="48" role="img" aria-label="Copy Ninjia — 単に真似をするだけでなく、チャット現場を丸ごと盗んで演じ直す。">
  <title>Copy Ninjia — 単に真似をするだけでなく、チャット現場を丸ごと盗んで演じ直す。</title>
  <defs>
    <linearGradient id="g-light" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6d4aff"/><stop offset="1" stop-color="#1789cd"/></linearGradient>
    <style>
      .txt { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Hiragino Sans', 'Yu Gothic', sans-serif; font-weight: 500; font-size: 21px; }
      .code { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-weight: 700; font-size: 22px; }
    </style>
  </defs>
  <text x="10" y="33" class="txt">
    <tspan class="code" fill="url(#g-light)">Copy Ninjia</tspan>
    <tspan fill="#24292f"> — 単に真似をするだけでなく、チャット現場を</tspan>
    <tspan fill="#6d4aff">丸ごと盗んで演じ直す</tspan>
    <tspan fill="#24292f">。</tspan>
  </text>
</svg>
