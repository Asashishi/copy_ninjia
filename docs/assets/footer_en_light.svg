<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 48" width="910" height="48" role="img" aria-label="Copy Ninjia — Not just copying messages, but stealing the entire group-chat scene and re-enacting it.">
  <title>Copy Ninjia — Not just copying messages, but stealing the entire group-chat scene and re-enacting it.</title>
  <defs>
    <linearGradient id="g-light" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6d4aff"/><stop offset="1" stop-color="#1789cd"/></linearGradient>
    <style>
      .txt { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 500; font-size: 21px; }
      .code { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-weight: 700; font-size: 22px; }
    </style>
  </defs>
  <text x="8" y="33" class="txt">
    <tspan class="code" fill="url(#g-light)">Copy Ninjia</tspan>
    <tspan fill="#24292f"> — Not just copying messages, but </tspan>
    <tspan fill="#6d4aff">stealing the entire group-chat scene</tspan>
    <tspan fill="#24292f"> and re-enacting it.</tspan>
  </text>
</svg>
