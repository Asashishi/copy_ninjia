<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 48" width="910" height="48" role="img" aria-label="Copy Ninjia — 単に真似をするだけでなく、チャット現場を丸ごと盗んで演じ直す。">
  <title>Copy Ninjia — 単に真似をするだけでなく、チャット現場を丸ごと盗んで演じ直す。</title>
  <defs>
    <linearGradient id="g-dark" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a99bff"/><stop offset="1" stop-color="#58b9ec"/></linearGradient>
    <style>
      .txt { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Hiragino Sans', 'Yu Gothic', sans-serif; font-weight: 500; font-size: 22px; }
      .code { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-weight: 700; font-size: 23px; }
    </style>
  </defs>
  <text x="8" y="34" class="txt">
    <tspan class="code" fill="url(#g-dark)">Copy Ninjia</tspan>
    <tspan fill="#e6edf3"> — 単に真似をするだけでなく、チャット現場を</tspan>
    <tspan fill="#a99bff">丸ごと盗んで演じ直す</tspan>
    <tspan fill="#e6edf3">。</tspan>
  </text>
</svg>
