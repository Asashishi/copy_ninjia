[test]
preload = ["./test/preload.ts"]
coverageSkipTestFiles = true
coverageThreshold = { line = 0.90, function = 0.90 }

[install]
# 依赖冷却期：只解析发布满 3 天的版本，使投毒版本在被 npm 下架前无法进入依赖树。
# 不设 minimumReleaseAgeExcludes：当前依赖的 latest 均已远超该阈值，无需豁免任何包。
# 受害版本禁装清单与解锁条件见 AGENTS.md「供应链版本锁定」。
minimumReleaseAge = 259_200
